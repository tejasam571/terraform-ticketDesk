name: Build, Scan, Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: tkt-tsg-argo-suite      # must match module.ecr repository_name in terraform-ticketDesk
  ECS_CLUSTER: tkt-tsg-cluster            # must match module.ecs cluster_name
  ECS_SERVICE: tkt-tsg-service            # must match module.ecs service_name

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Fails the job (and blocks everything downstream) if secrets are found

  test:
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - uses: actions/checkout@v4
      - name: Backend unit tests
        working-directory: ./backend
        run: |
          npm ci
          npm test --if-present
        # Swap this block for `pip install -r requirements.txt && pytest -q`
        # if backend/ is actually Python — you have package.json in the repo
        # tree so this assumes Node. Tell me if that's wrong.

  build-and-push:
    runs-on: ubuntu-latest
    needs: test
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Extract metadata (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}
          tags: |
            type=sha,format=short
          # No "latest" tag — checklist #4 requires commit-SHA tagging only,
          # and the ECR repo is set to IMMUTABLE tags so "latest" would fail anyway.

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    env:
      IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR (for registry URL)
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Register new task definition revision
        run: |
          TASK_FAMILY="tkt-tsg-argo-suite"
          aws ecs describe-task-definition --task-definition "$TASK_FAMILY" \
            --query 'taskDefinition' > current-task-def.json

          NEW_IMAGE="${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}"
          jq --arg IMAGE "$NEW_IMAGE" \
             '.containerDefinitions[0].image = $IMAGE
              | del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                    .compatibilities, .registeredAt, .registeredBy)' \
             current-task-def.json > new-task-def.json

          aws ecs register-task-definition --cli-input-json file://new-task-def.json

      - name: Deploy to ECS
        run: |
          aws ecs update-service \
            --cluster "${{ env.ECS_CLUSTER }}" \
            --service "${{ env.ECS_SERVICE }}" \
            --task-definition tkt-tsg-argo-suite \
            --force-new-deployment

          aws ecs wait services-stable \
            --cluster "${{ env.ECS_CLUSTER }}" \
            --services "${{ env.ECS_SERVICE }}"

      - name: Smoke test
        run: |
          ALB_URL=$(aws elbv2 describe-load-balancers \
            --names tkt-tsg-alb \
            --query 'LoadBalancers[0].DNSName' --output text)
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "http://$ALB_URL/")
          echo "Got HTTP $STATUS from $ALB_URL"
          if [ "$STATUS" -ge 400 ]; then
            echo "Smoke test failed — deployment considered broken"
            exit 1
          fi